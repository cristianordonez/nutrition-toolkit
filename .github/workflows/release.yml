name: Release
on:
   push:
      branches: [main, github-actions]
env:
   REGISTRY: ghcr.io
jobs:
   get-latest-version:
      runs-on: ubuntu-latest
      outputs:
         latest-version: ${{ steps.get_latest_version.outputs.LATEST_VERSION }}
      steps:
         - name: Checkout repository
           uses: actions/checkout@v4
         - name: Get version from package.json
           id: get_latest_version
           env:
               GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              LATEST_VERSION=$(gh release view --json tagName --jq '.tagName')
              echo "LATEST_VERSION=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
   get-pr-title:
      runs-on: ubuntu-latest
      outputs:
         pr-title: ${{ steps.get_pr_title.outputs.PR_TITLE }}
      steps:
         - name: Checkout repository
           uses: actions/checkout@v4
         - name: Get version from package.json
           id: get_pr_title
           env:
               GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              PR_TITLE=$(gh pr list --base main --state merged --limit 1 --json title --jq '.[].title')
              echo "PR_TITLE=$PR_TITLE" >> "$GITHUB_OUTPUT"
   update-version:
      runs-on: ubuntu-latest
      needs:
         - get-latest-version
         - get-pr-title
      outputs:
         release-version: ${{ steps.get_version.outputs.RELEASE_VERSION }}
      steps:
         - name: Checkout repository
           uses: actions/checkout@v4
         - name: Use Pull Request title to determine new version
           id: get_version
           run: |
              IFS=' ' read -ra title_array <<< "${{ needs.get-pr-title.outputs.pr-title }}"
              PR_TITLE_ID="${title_array[0]}"
              LATEST_VERSION="${{ needs.get-latest-version.outputs.latest-version }}"
              version=${LATEST_VERSION#v}
              IFS='.' read -r major minor patch <<< "$version"
              if [[ -z "$PR_TITLE_ID" ]]; then
               echo "Pull request title ${{ needs.get-pr-title.outputs.pr-title}} must start with 'fix:', 'feature:', or 'BREAKING CHANGE:'"
               exit 1
              elif grep -iq "$PR_TITLE_ID" <<< "fix"; then
               patch=$((patch + 1))
              elif grep -iq "$PR_TITLE_ID" <<< "finalized"; then
               minor=$((minor + 1))
              elif [[ $PR_TITLE_ID == "BREAKING CHANGE" ]]; then
               major=$((major + 1))
              else
               echo "Pull request title ${{ needs.get-pr-title.outputs.pr-title}} does not match expected format"
               exit 1
              fi
              RELEASE_VERSION="v$major.$minor.$patch"
              echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
   tag:
      runs-on: ubuntu-latest
      permissions: write-all
      needs:
         - update-version
      steps:
         - name: Checkout repository
           uses: actions/checkout@v7
         - name: Create and Push Git Tag
           run: |
              git config --local user.email "github-actions[bot]@users.noreply.github.com"
              git config --local user.name "github-actions[bot]"
              echo "Creating annotated tag: ${{ needs.update-version.outputs.release-version }}"
              git tag -a "${{ needs.update-version.outputs.release-version }}" -m "Release ${{ needs.update-version.outputs.release-version }} via GitHub Actions"
              git push origin "${{ needs.update-version.outputs.release-version }}"
         - name: Create Release
           id: create_release
           uses: actions/create-release@latest
           env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           with:
              tag_name: ${{ needs.update-version.outputs.release-version }}
              release_name: ${{ needs.update-version.outputs.release-version }}
              prerelease: false
              draft: false
   build-push-image:
      runs-on: ubuntu-latest
      needs:
         - update-version
         - tag
      permissions: write-all
      steps:
         - name: Checkout repository
           uses: actions/checkout@v7
         - name: Setup Node
           uses: actions/setup-node@v4
           with:
               node-version: '20'
         - name: Update package.json version
           run: |
            INPUT="${{ needs.update-version.outputs.release-version }}"
            VERSION=${INPUT#v}
            npm version $VERSIONj --no-git-tag-version
         - name: Log into registry ${{ env.REGISTRY }}
           uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
           with:
              registry: ${{ env.REGISTRY }}
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
         - name: docker build
           run: docker build -t ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.update-version.outputs.release-version }} .
         - name: docker push
           run: docker push ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.update-version.outputs.release-version }}
   deploy:
      runs-on: ubuntu-latest
      needs:
         - build-push-image
         - update-version
      permissions: write-all
      steps:
         - name: Checkout repository
           uses: actions/checkout@v7
         - name: Copy deployment script
           uses: appleboy/scp-action@v1.0.0
           with:
              host: ${{ secrets.DIGITALOCEAN_HOST }}
              username: ${{ secrets.DIGITALOCEAN_USERNAME }}
              key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
              source: 'scripts/pull-run-container.sh'
              target: '~/deploy'
         - name: ssh to server and run deployment script
           env:
              DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.update-version.outputs.release-version }}
              PORT: ${{ secrets.DIGITALOCEAN_PORT }}
              CONTAINER_NAME: nutrition-toolkit
           uses: appleboy/ssh-action@v1.0.0
           with:
              host: ${{ secrets.DIGITALOCEAN_HOST }}
              username: ${{ secrets.DIGITALOCEAN_USERNAME }}
              key: ${{ secrets.DIGITALOCEAN_SSH_KEY }}
              envs: DOCKER_IMAGE,PORT,CONTAINER_NAME
              script: |
                 chmod +x ~/deploy/scripts/pull-run-container.sh
                 ~/deploy/scripts/pull-run-container.sh
