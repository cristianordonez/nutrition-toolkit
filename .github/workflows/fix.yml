name: Fix
on:
   push:
jobs:
   test:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout repository
           uses: actions/checkout@v4
         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: npm
         - name: Install dependencies
           run: npm ci
         - name: Run test
           run: npm run test
   scan:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout
           uses: actions/checkout@v4
         - name: TruffleHog Enterprise scan
           uses: trufflesecurity/TruffleHog-Enterprise-Github-Action@main
   lint:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout repository
           uses: actions/checkout@v4
         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: npm
         - name: Install dependencies
           run: npm ci
         - name: Run lint
           run: npm run check:lint
   format:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout repository
           uses: actions/checkout@v4
         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: npm
         - name: Install dependencies
           run: npm ci
         - name: Run format
           run: npm run check:format
